name: Build & release Android

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧋 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔤 Compile translations
        run: pnpm intl:build

      - name: ✏️ Write google-services.json
        run: echo "$GOOGLE_SERVICES" | base64 -d > ./google-services.json

      - name: 🏗️ Prebuild (generate native Android project via Expo)
        run: npx expo prebuild --platform android --no-install

      - name: 🔧 Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: 📦 Build Android APK
        run: cd android && ./gradlew assembleRelease

      - name: 🔍 Find release APK
        id: find_apk
        run: |
          APK_PATH=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenna-party.apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: ⬆️ Push File to R2 Bucket
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put shit/app-release.apk --file=${{ steps.find_apk.outputs.apk_path }}

      - name: 💬 Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"<@&1534855421678981150> tenna.party (${{ github.ref_name }}) has been updated on android, check it out! sha: ${{ github.sha }}"}" \
               $DISCORD_WEBHOOK