name: Build & release Android

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
      NODE_ENV: production
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧋 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📋 Verify Java, Node, and GLIBC versions
        run: |
          echo "=== Java Version ==="
          java -version
          javac -version
          echo ""
          echo "=== Node.js Version ==="
          node --version
          npm --version
          pnpm --version
          echo ""
          echo "=== GLIBC Version ==="
          ldd --version | head -1

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: 📦 Install Android SDK Components
        run: |
          # Install NDK versions
          echo "Installing NDK 27.0.12077973..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

          echo "Installing NDK 27.1.12297006..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"

          # Install Platform APIs
          echo "Installing Android API 35..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

          echo "Installing Android API 36..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

          # Install Build Tools
          echo "Installing Build Tools 35.0.0..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

          echo "Installing Build Tools 37.0.0..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0"

      - name: ✅ Verify Android SDK Installation
        run: |
          echo "=== Android SDK Root ==="
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo ""
          echo "=== Installed NDK Versions ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/" 2>/dev/null || echo "NDK directory not found"
          echo ""
          echo "=== Installed Platforms ==="
          ls -la "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || echo "Platforms directory not found"
          echo ""
          echo "=== Installed Build Tools ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || echo "Build-tools directory not found"

      - name: ⚙️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔤 Compile translations
        run: pnpm intl:build

      - name: ✏️ Write google-services.json
        run: echo "$GOOGLE_SERVICES" | base64 -d > ./google-services.json

      - name: 🏗️ Prebuild (generate native Android project via Expo)
        run: npx expo prebuild --platform android --no-install

      - name: 🔧 Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: 📦 Build Android APK
        run: |
          cd android
          # pass -PnewArchEnabled=true as well to ensure the project property is set for this build
          ./gradlew assembleRelease -PnewArchEnabled=true

      - name: 🔍 Find release APK
        id: find_apk
        run: |
          APK_PATH=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          mkdir -p $RUNNER_TEMP/LOL
          cp -r $APK_PATH $RUNNER_TEMP/LOL/
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenna-party.apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: ⬆️ Push File to R2 Bucket
        uses: rajatkulkarni95/upload-r2-github-action@v0.1.0
        env:
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          source_dir: ${{ runner.temp }}/LOL/
          bucket: shit
          access_key_id: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: 💬 Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"<@&1534855421678981150> tenna.party (${{ github.ref_name }}) has been updated on android, check it out! sha: ${{ github.sha }}\"}" \
               $DISCORD_WEBHOOK
