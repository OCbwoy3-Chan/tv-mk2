name: Build & release Android

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
      NODE_ENV: production
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🧋 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔤 Compile translations
        run: pnpm intl:build

      - name: ✏️ Write google-services.json
        run: echo "$GOOGLE_SERVICES" | base64 -d > ./google-services.json

      - name: 🏗️ Prebuild (generate native Android project via Expo)
        run: npx expo prebuild --platform android --no-install

      - name: ✍️ Ensure android/gradle.properties (CI-only)
        run: |
          # create android dir if missing and write required properties for CI build
          mkdir -p android
          # add JVM memory and new architecture flag required by some native modules
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          # ensure we set newArchEnabled to true so react-native-reanimated's check passes
          echo "newArchEnabled=true" >> android/gradle.properties
          echo "---- android/gradle.properties ----"
          cat android/gradle.properties

      - name: 🔧 Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: 📦 Build Android APK
        run: |
          cd android
          # pass -PnewArchEnabled=true as well to ensure the project property is set for this build
          ./gradlew assembleRelease -PnewArchEnabled=true

      - name: 🔍 Find release APK
        id: find_apk
        run: |
          APK_PATH=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenna-party.apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: ⬆️ Push File to R2 Bucket
        run: | 
          export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          pnpm dlx wrangler r2 object delete shit/app-release.ipa
          pnpm dlx wrangler r2 object put shit/app-release.apk --file=${{ steps.find_apk.outputs.apk_path }}

      - name: 💬 Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"<@&1534855421678981150> tenna.party (${{ github.ref_name }}) has been updated on android, check it out! sha: ${{ github.sha }}"}" \
               $DISCORD_WEBHOOK